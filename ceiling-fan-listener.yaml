# #############################################################################
# ##  B99 433MHz CEILING-FAN RF BRIDGE  —  ESP32 + CC1101 (RadioLib)         ##
# ##  LISTENER — capture/decode tool for extracting a remote's ID and K     ##
# #############################################################################
#
#  A receive-only companion to the two bridge variants. Flash this TEMPORARILY
#  to capture your remote's codes, then flash your chosen bridge variant back.
#  Same wiring as the bridges — GDO0 on GPIO5, nothing else changes (the
#  CC1101 outputs demodulated RX data on the same GDO0 pin it takes TX data
#  on; GDO2 stays unconnected).
#
#  HOW TO USE:
#    1. Flash, then stream logs (`esphome logs ceiling-fan-listener.yaml`).
#    2. Hold the remote near the antenna and press a button once.
#    3. Read the decoded lines (tag "b99_decode"). One press = ~10 RF repeats,
#       so expect several identical lines — identical repeats are your
#       confidence signal. Example:
#         frame=0x003B940F id=0x003B9 (953) cmd=0x08 cnt=0 csum=0xF -> K=0xB (11)
#    4. Press several DIFFERENT buttons. K must come out identical on every
#       press of this remote (it's a per-remote constant). If K varies, the
#       bit alignment is off — see the README's "Finding K".
#    5. Copy the decimal id and K into the bridge variant's substitutions.
#       The counter (cnt) increments by one per press, mod 8 — a nice sanity
#       check that you're seeing distinct presses.
#
#  NON-B99 REMOTES: the decoder assumes the validated B99 32-bit layout
#  ([20 id][5 cmd][3 cnt][4 csum], short/long OOK pulse pairs). If the
#  decoded output looks wrong or K is inconsistent, uncomment `dump: raw`
#  below and decode by hand per the README (each HIGH mark > ~500us is a 1,
#  else 0, 32 bits MSB-first).
#
#  This tool also doubles as the bench feasibility check for the roadmap RX
#  feature: it proves the same-pin (GDO0) receive path on your hardware.
# #############################################################################

substitutions:
  device_name: ceiling-fan-listener
  friendly_name: "Ceiling Fan Listener"
  pin_rx: "5"                  # GDO0 — identical wiring to the bridge variants
  listen_freq: "433.92MHz"     # retune here if your remote is off-band

external_components:
  # Same pinned commit as the bridge variants.
  - source: github://juanboro/esphome-radiolib-cc1101@b79b8552d09682da561d8ff9b4b71ccea9b75f1b
    components: [ radiolib_cc1101 ]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret esp_433_radio__encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    on_begin:
      - lambda: id(mycc1101).standby();

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# The component enters receive mode by itself at setup (setup_direct_mode()
# ends in recv()), so no boot hook is needed. rx_pin is optional and only
# feeds the component's RSSI sampling; the demodulated data appears on GDO0
# by hardware configuration regardless.
radiolib_cc1101:
  id: mycc1101
  cs_pin: GPIO10
  frequency: ${listen_freq}
  modulation: OOK              # explicit for documentation (also the default)
  filter: 464kHz               # RX bandwidth (component default; 58-812kHz)
  bitrate: 10                  # RX sampling ~100us resolution — cleanly separates
                               # the ~250us and ~760us marks with less noise than
                               # higher rates (component author's RX example value)
  rx_pin:
    number: ${pin_rx}
    allow_other_uses: true     # remote_receiver reads the same GPIO below

remote_receiver:
  id: rf_receiver
  pin:
    number: ${pin_rx}
    allow_other_uses: true
    mode:
      input: true
      pullup: true
  # idle MUST be shorter than the ~7750us inter-frame sync gap but longer
  # than the longest within-frame space (~750us), or all 10 repeats merge
  # into one oversized capture and the buffer overflows. A flood of
  # "Buffer overflow" means the radio IS hearing the remote — fix idle,
  # don't chase the RF. 5500us splits cleanly between repeats.
  idle: 5500us
  filter: 120us                # reject sub-bit noise glitches
  buffer_size: 10kb
  tolerance: 35%
  # Uncomment for raw pulse lists (hand-decoding unknown protocols); noisy.
  # dump: raw
  on_raw:
    - lambda: |-
        // Decode one B99/EV1527 frame from a capture chunk. Chunk anatomy:
        // the sync gap (~7750us low) exceeds idle, so each chunk is
        // [32 bit marks/spaces][next repeat's 250us sync mark] — the first
        // 32 marks ARE the frame, MSB first. Sync-only chunks are skipped.
        std::vector<int32_t> marks;
        for (int32_t v : x)
          if (v > 0) marks.push_back(v);
        if (marks.size() < 32) return;   // sync-only chunk or noise
        uint32_t frame = 0;
        for (int i = 0; i < 32; i++) {
          if (marks[i] < 100 || marks[i] > 1000) return;  // not bit-shaped: skip chunk
          frame = (frame << 1) | (marks[i] > 500 ? 1u : 0u);
        }
        const uint32_t rid  = frame >> 12;          // 20-bit remote ID
        const uint8_t  cmd  = (frame >> 7) & 0x1F;  // 5-bit command
        const uint8_t  cnt  = (frame >> 4) & 0x7;   // 3-bit rolling counter
        const uint8_t  csum = frame & 0xF;          // 4-bit checksum
        // checksum = nibble(bits11-8) ^ nibble(bits7-4) ^ K  =>  solve for K
        const uint8_t  A = (frame >> 8) & 0xF;
        const uint8_t  B = (frame >> 4) & 0xF;
        const uint8_t  K = A ^ B ^ csum;
        ESP_LOGI("b99_decode",
                 "frame=0x%08X id=0x%05X (%u) cmd=0x%02X cnt=%u csum=0x%X -> K=0x%X (%u) rssi=%.0fdBm",
                 (unsigned) frame, (unsigned) rid, (unsigned) rid,
                 (unsigned) cmd, (unsigned) cnt, (unsigned) csum,
                 (unsigned) K, (unsigned) K, id(mycc1101).getRSSI());
