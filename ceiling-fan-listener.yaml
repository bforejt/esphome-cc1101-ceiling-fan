# #############################################################################
# ##  B99 433MHz CEILING-FAN RF BRIDGE  —  ESP32 + CC1101 (RadioLib)         ##
# ##  LISTENER — capture/decode tool with raw/decode toggle + tunable freq  ##
# #############################################################################
#
#  A receive-only companion to the two bridge variants, for extracting a
#  remote's ID and checksum key K, characterizing unknown remotes, and
#  frequency-hunting. Flash it TEMPORARILY, then reflash your bridge variant.
#
#  RX CHAIN — deliberately identical to the stateful variant's PROVEN receive
#  path: RX data on GDO2 -> GPIO6 (routed via a boot-time IOCFG2 write),
#  DRATE bitrate 100, stock SmartRC AGC. Do not "improve" these: bitrate 10
#  and DN022 AGC values were each bench-proven completely deaf on this
#  hardware (see the README and git history). Earlier revisions of this
#  listener shipped bitrate 10 — which is very likely why they heard nothing.
#  FALLBACK for boards with only GDO0 wired: set pin_rx to "5" — in receive
#  mode RadioLib routes data to GDO0 natively (the IOCFG2 write is then
#  harmless surplus).
#
#  CONTROLS (all usable from the ESP's web page or HA):
#    - "Raw Dump Mode" switch — either/or output selector:
#        OFF (default) = DECODE mode: each capture chunk is decoded as a B99
#          frame and logged (tag "b99_decode") with id/cmd/cnt/csum, the
#          solved K, and RSSI. One wall-remote press = ~10 repeats = ~10
#          identical lines; identical repeats are your confidence signal.
#          K must be constant across different buttons of one remote; cnt
#          increments per press, mod 8.
#        ON = RAW mode: the pulse list of every capture chunk is printed
#          (tag "raw"; marks positive us, spaces negative us) — for
#          hand-decoding non-B99 protocols or diagnosing decoder misses.
#          Expect sporadic noise chunks with no transmission; that is normal
#          for a wide-open OOK receiver and proves the pin path works.
#    - "Listen Frequency" number + "Apply Frequency" button — type a
#      frequency (MHz), press Apply: the radio re-tunes and restarts RX
#      there. Survives reboot. Useful for hunting an off-center remote
#      (cheap SAW-resonator transmitters can sit 100+ kHz off 433.92).
#    - RSSI watcher (tag "rssi"): logs whenever RSSI moves >6 dB. Idle floor
#      is typically -90s dBm; a remote pressed nearby must spike it — the
#      carrier-detect layer that works regardless of decoding.
#
#  HOW TO EXTRACT A REMOTE'S ID/K: flash, leave Raw Dump Mode OFF, stream
#  logs (or open the web page), press each remote button near the antenna,
#  read id/K off the b99_decode lines, copy the DECIMAL values into your
#  bridge variant's substitutions.
# #############################################################################

substitutions:
  device_name: ceiling-fan-listener
  friendly_name: "Ceiling Fan Listener"
  pin_rx: "6"                  # GDO2 (proven RX path). "5" = GDO0 fallback for
                               # boards without the GDO2 wire.

external_components:
  # Same pinned commit as the bridge variants.
  - source: github://juanboro/esphome-radiolib-cc1101@b79b8552d09682da561d8ff9b4b71ccea9b75f1b
    components: [ radiolib_cc1101 ]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Route demodulated RX data to GDO2 (RadioLib's async direct mode
          // only configures GDO0). Harmless surplus when pin_rx is GDO0.
          id(mycc1101).radio.SPIsetRegValue(RADIOLIB_CC1101_REG_IOCFG2,
                                            RADIOLIB_CC1101_GDOX_SERIAL_DATA_ASYNC, 5, 0);
          // Re-apply the saved listen frequency (the number restores from
          // flash; the component config only sets the first-boot default).
          const float f = id(listen_freq).state;
          if (!std::isnan(f) && f >= 300.0f && f <= 928.0f) {
            id(mycc1101)._freq = f;
            id(mycc1101).setup_direct_mode();   // registers + re-enter RX
            id(mycc1101).radio.SPIsetRegValue(RADIOLIB_CC1101_REG_IOCFG2,
                                              RADIOLIB_CC1101_GDOX_SERIAL_DATA_ASYNC, 5, 0);
          }
          ESP_LOGI("listener", "listening at %.3f MHz on GPIO%d (%s mode)",
                   id(mycc1101)._freq, ${pin_rx},
                   id(raw_mode).state ? "RAW" : "DECODE");

esp32:
  board: esp32-s3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret esp_433_radio__encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    on_begin:
      - lambda: id(mycc1101).standby();
    # A failed OTA keeps running with the radio in standby — recover RX.
    on_error:
      - lambda: id(mycc1101).recv();

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# The PROVEN receive configuration (matches the stateful variant): the
# component enters RX by itself at setup, DRATE 100 + stock SmartRC AGC is
# the working combo on this hardware, 464 kHz keeps capture odds high for
# off-center remotes. frequency: is only the first-boot default — runtime
# tuning goes through the Listen Frequency number + Apply button.
radiolib_cc1101:
  id: mycc1101
  cs_pin: GPIO10
  frequency: 433.92MHz
  modulation: OOK
  filter: 464kHz
  bitrate: 100

# Either/or output selector — see header.
switch:
  - platform: template
    id: raw_mode
    name: "Raw Dump Mode"
    icon: mdi:pulse
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Runtime frequency tuning. Type a value, then press Apply — the number
# alone does NOT retune (deliberate: lets you compose a value without the
# radio chasing every keystroke).
number:
  - platform: template
    id: listen_freq
    name: "Listen Frequency"
    icon: mdi:sine-wave
    unit_of_measurement: "MHz"
    mode: box
    min_value: 387        # CC1101 mid band is 387-464 MHz (chip also does
    max_value: 464        # 300-348 and 779-928; widen these if you need them)
    step: 0.005           # 5 kHz — fine enough to sweep for an offset remote
    initial_value: 433.92
    restore_value: true
    optimistic: true

button:
  - platform: template
    name: "Apply Frequency"
    icon: mdi:radio-tower
    on_press:
      - lambda: |-
          const float f = id(listen_freq).state;
          if (std::isnan(f)) return;
          id(mycc1101)._freq = f;
          id(mycc1101).setup_direct_mode();   // standby -> registers -> recv()
          // IOCFG registers survive mode changes, but re-assert for safety.
          id(mycc1101).radio.SPIsetRegValue(RADIOLIB_CC1101_REG_IOCFG2,
                                            RADIOLIB_CC1101_GDOX_SERIAL_DATA_ASYNC, 5, 0);
          ESP_LOGI("listener", "re-tuned: listening at %.3f MHz", f);

# Carrier-detect layer: logs only on >6 dB movement, so it is quiet at the
# idle floor and fires when a remote transmits nearby. SPI register read;
# does not touch the RX pin.
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static float last_logged = -999.0f;
          const float r = id(mycc1101).getRSSI();
          if (r - last_logged > 6.0f || last_logged - r > 6.0f) {
            ESP_LOGI("rssi", "%.0f dBm", r);
            last_logged = r;
          }

remote_receiver:
  id: rf_receiver
  pin:
    number: ${pin_rx}
    mode:
      input: true
      pullup: true
  # idle MUST be shorter than the ~7750us inter-frame sync gap but longer
  # than the longest within-frame space (~750us), or all 10 repeats merge
  # into one oversized capture and the buffer overflows. A flood of
  # "Buffer overflow" means the radio IS hearing the remote — fix idle,
  # don't chase the RF.
  idle: 5500us
  filter: 120us                # reject sub-bit noise glitches
  buffer_size: 10kb
  tolerance: 35%
  on_raw:
    - lambda: |-
        // ---------------- RAW MODE: print the pulse list ----------------
        // Marks are positive microseconds, spaces negative. Chunked into
        // readable log lines.
        if (id(raw_mode).state) {
          ESP_LOGI("raw", "---- chunk: %u edges ----", (unsigned) x.size());
          char buf[160];
          int pos = 0, count = 0;
          buf[0] = '\0';
          for (int32_t v : x) {
            pos += snprintf(buf + pos, sizeof(buf) - pos, "%ld ", (long) v);
            if (++count % 16 == 0 || pos > 120) {
              ESP_LOGI("raw", "  %s", buf);
              pos = 0;
              buf[0] = '\0';
            }
          }
          if (pos > 0) ESP_LOGI("raw", "  %s", buf);
          return;
        }
        // -------------- DECODE MODE: B99 scan-window decoder --------------
        // Chunk anatomy: the sync gap (~7750us low) exceeds idle, so a clean
        // chunk is [32 bit marks/spaces][next repeat's 250us sync mark].
        // Noise can prepend slivers, so scan for the first window of 32
        // consecutive bit-shaped marks. Every repeat logs — with a real
        // press you should see ~10 identical lines (your confidence signal).
        std::vector<int32_t> marks;
        for (int32_t v : x)
          if (v > 0) marks.push_back(v);
        ESP_LOGD("b99_decode", "chunk: %u edges, %u marks",
                 (unsigned) x.size(), (unsigned) marks.size());
        if (marks.size() < 32) return;   // sync-only chunk or noise sliver
        const int n = (int) marks.size();
        uint32_t frame = 0;
        bool found = false;
        for (int s = 0; s + 32 <= n && !found; s++) {
          uint32_t f = 0;
          bool ok = true;
          for (int i = 0; i < 32; i++) {
            const int32_t m = marks[s + i];
            if (m < 100 || m > 1000) { ok = false; break; }
            f = (f << 1) | (m > 500 ? 1u : 0u);
          }
          if (ok) { frame = f; found = true; }
        }
        if (!found) {
          ESP_LOGD("b99_decode", "no bit-shaped 32-mark window — flip Raw Dump Mode on to inspect");
          return;
        }
        const uint32_t rid  = frame >> 12;          // 20-bit remote ID
        const uint8_t  cmd  = (frame >> 7) & 0x1F;  // 5-bit command
        const uint8_t  cnt  = (frame >> 4) & 0x7;   // 3-bit rolling counter
        const uint8_t  csum = frame & 0xF;          // 4-bit checksum
        // checksum = nibble(bits11-8) ^ nibble(bits7-4) ^ K  =>  solve for K
        const uint8_t  K = ((frame >> 8) & 0xF) ^ ((frame >> 4) & 0xF) ^ csum;
        ESP_LOGI("b99_decode",
                 "frame=0x%08X id=0x%05X (%u) cmd=0x%02X cnt=%u csum=0x%X -> K=0x%X (%u) rssi=%.0fdBm",
                 (unsigned) frame, (unsigned) rid, (unsigned) rid,
                 (unsigned) cmd, (unsigned) cnt, (unsigned) csum,
                 (unsigned) K, (unsigned) K, id(mycc1101).getRSSI());
