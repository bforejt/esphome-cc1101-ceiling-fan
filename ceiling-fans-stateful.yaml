# -----------------------------------------------------------------------------
# RX — decode the physical remotes on GDO2/GPIO6 and mirror their presses
# into the entities (suppressed sync: no re-transmit; the native API pushes
# the change to HA live). One INFO line per accepted press. Unknown remote
# IDs are logged for discovery (tag "rx_discover") — visible in the ESP web
# page's log pane.
# -----------------------------------------------------------------------------
remote_receiver:
  id: rf_receiver
  pin:
    number: ${pin_rx}
    mode:
      input: true
      pullup: true
  # idle MUST be < the 7750us inter-frame sync gap but > the longest
  # within-frame space (~750us), or repeats merge and overflow the buffer.
  idle: 5500us
  filter: 120us
  buffer_size: 10kb
  tolerance: 35%
  on_raw:
    - lambda: |-
        // ---- Gates.
        // Never process RX while ANY suppress window is open (boot restore
        // included) — processing would end by clearing suppress_tx and could
        // stomp the outer window's guard.
        if (id(suppress_tx)) return;
        // Nothing during, or within 1.2s after, our own TX. GDO2 should be
        // quiet while transmitting (demodulator off), but a settle glitch
        // decoded as a Light frame would double-flip the assumed light
        // state — cheap insurance.
        if (id(radio_txing)) return;
        if ((millis() - id(tx_last_ms)) < 1200) return;

        // ---- Decode. A clean chunk is [32 bit marks/spaces][next repeat's
        // 250us sync mark]; noise can prepend slivers (the 120us receiver
        // filter guarantees any surviving sliver passes the 100us shape
        // bound), so scan ALL windows and PREFER one that validates against
        // a configured remote (ID + checksum-K). Fall back to the first
        // shape-valid window only for discovery of unknown remotes, which
        // cannot be K-checked.
        std::vector<int32_t> marks;
        for (int32_t v : x)
          if (v > 0) marks.push_back(v);
        if (marks.size() < 32) return;   // sync-only chunk or noise
        const int n = (int) marks.size();
        uint32_t frame = 0;
        bool found = false;    // first shape-valid window (discovery fallback)
        bool valid = false;    // window that matches a configured ID with valid K
        for (int s = 0; s + 32 <= n && !valid; s++) {
          uint32_t f = 0;
          bool ok = true;
          for (int i = 0; i < 32; i++) {
            const int32_t m = marks[s + i];
            if (m < 100 || m > 1000) { ok = false; break; }
            f = (f << 1) | (m > 500 ? 1u : 0u);
          }
          if (!ok) continue;
          if (!found) { frame = f; found = true; }
          const uint32_t r2 = f >> 12;
          const uint8_t  k2 = ((f >> 8) & 0xF) ^ ((f >> 4) & 0xF) ^ (f & 0xF);
          if ((r2 == (uint32_t) ${office_id_dec} && k2 == (${office_k} & 0xF)) ||
              (r2 == (uint32_t) ${guest_id_dec}  && k2 == (${guest_k} & 0xF)) ||
              (r2 == (uint32_t) ${green_id_dec}   && k2 == (${green_k} & 0xF))) {
            frame = f;
            valid = true;
          }
        }
        if (!found) return;

        const uint32_t rid  = frame >> 12;          // 20-bit remote ID
        const uint8_t  cmd  = (frame >> 7) & 0x1F;  // 5-bit command
        const uint8_t  cnt  = (frame >> 4) & 0x7;   // 3-bit rolling counter
        const uint8_t  csum = frame & 0xF;
        const uint8_t  K    = ((frame >> 8) & 0xF) ^ ((frame >> 4) & 0xF) ^ csum;
        const uint32_t now  = millis();

        // ---- Route. Dedup state is committed ONLY after a frame passes
        // validation for its path — a rejected misdecode must never poison
        // the dedup slot, or the next clean repeat of the same press would
        // re-fire the action (double-flipping the assumed light state).
        int unit;
        if (valid) {
          unit = (rid == (uint32_t) ${office_id_dec}) ? 0
               : (rid == (uint32_t) ${guest_id_dec})  ? 1 : 2;
        } else if (rid == (uint32_t) ${office_id_dec} || rid == (uint32_t) ${guest_id_dec} ||
                   rid == (uint32_t) ${green_id_dec}) {
          // Shape-valid but K wrong and no validated window in the chunk:
          // a misdecoded repeat. Log and ignore; no state, no dedup.
          ESP_LOGW("rx_b99", "%s ID but K=0x%X — misdecode, ignored (frame=0x%08X)",
                   rid == (uint32_t) ${office_id_dec} ? "office"
                 : rid == (uint32_t) ${guest_id_dec}  ? "guest" : "green",
                   K, (unsigned) frame);
          return;
        } else {
          // Discovery: point the web-page log at any B99-family remote.
          // Separate dedup slot so one press logs once, and a discovery
          // frame never masks a same-moment press of OUR remotes.
          static uint32_t disc_last_frame = 0;
          static uint32_t disc_last_ms = 0;
          if (frame == disc_last_frame && (now - disc_last_ms) < 2000) { disc_last_ms = now; return; }
          disc_last_frame = frame;
          disc_last_ms = now;
          ESP_LOGI("rx_discover",
                   "unknown remote: id=0x%05X (%u) cmd=0x%02X cnt=%u csum=0x%X -> K=0x%X (%u) frame=0x%08X rssi=%.0fdBm",
                   (unsigned) rid, (unsigned) rid, (unsigned) cmd, (unsigned) cnt,
                   (unsigned) csum, (unsigned) K, (unsigned) K,
                   (unsigned) frame, id(mycc1101).getRSSI());
          return;
        }

        // ---- Dedup (validated frames only): one action per physical
        // press. A press is ~10 repeats of the identical frame; the counter
        // increments per press, so even an immediate re-press of the same
        // button differs. Refreshing the timestamp keeps a held button
        // suppressed.
        static uint32_t last_frame = 0;
        static uint32_t last_ms = 0;
        if (frame == last_frame && (now - last_ms) < 2000) { last_ms = now; return; }
        last_frame = frame;
        last_ms = now;
        // STATUS-LED (5/5, optional): note the accepted press for the LED
        // painter; harmless if the LED sections are removed.
        id(rx_last_ms) = now;

        // ---- Per-unit handles (globals are references; entities are the
        // same template types for both fans).
        bool    &g_on     = (unit == 0) ? id(office_fan_on)     : (unit == 1) ? id(guest_fan_on)     : id(green_fan_on);
        uint8_t &g_speed  = (unit == 0) ? id(office_fan_speed)  : (unit == 1) ? id(guest_fan_speed)  : id(green_fan_speed);
        bool    &g_fwd    = (unit == 0) ? id(office_fan_fwd)    : (unit == 1) ? id(guest_fan_fwd)    : id(green_fan_fwd);
        bool    &g_breeze = (unit == 0) ? id(office_fan_breeze) : (unit == 1) ? id(guest_fan_breeze) : id(green_fan_breeze);
        bool    &g_light  = (unit == 0) ? id(office_light_on)   : (unit == 1) ? id(guest_light_on)   : id(green_light_on);
        uint8_t &g_ctr    = (unit == 0) ? id(ctr_office)        : (unit == 1) ? id(ctr_guest)        : id(ctr_green);
        fan::Fan *f = (unit == 0) ? (fan::Fan *) id(office_fan)
                    : (unit == 1) ? (fan::Fan *) id(guest_fan)
                                  : (fan::Fan *) id(green_fan);
        auto *lt = (unit == 0) ? id(office_light) : (unit == 1) ? id(guest_light) : id(green_light);
        const char *who = (unit == 0) ? "office" : (unit == 1) ? "guest" : "green";
        // TX parameters for this unit (used by the deferred-direction settle).
        const int   u_id   = (unit == 0) ? ${office_id_dec}   : (unit == 1) ? ${guest_id_dec}   : ${green_id_dec};
        const int   u_k    = (unit == 0) ? ${office_k}        : (unit == 1) ? ${guest_k}        : ${green_k};
        const float u_freq = (unit == 0) ? ${office_freq_mhz} : (unit == 1) ? ${guest_freq_mhz} : ${green_freq_mhz};

        // Resync our TX counter to follow the remote's sequence.
        g_ctr = (cnt + 1) & 0x7;

        // Speed command lookup (1..6), 0 = not a speed command.
        int spd = 0;
        switch (cmd) {
          case 0x10: spd = 1; break;
          case 0x12: spd = 2; break;
          case 0x1C: spd = 3; break;
          case 0x0A: spd = 4; break;
          case 0x0F: spd = 5; break;
          case 0x0C: spd = 6; break;
        }

        // ---- Mirror the press into assumed state + entities, suppressed
        // (the All Off button pattern): no RF goes out, HA updates live.
        id(suppress_tx) = true;
        if (spd > 0) {
          // Capture BEFORE mutating anything. "entity direction != assumed
          // physical direction" is precisely the signal that the HA user set
          // a direction while the fan was off (a pending wish); the two agree
          // in every other situation. Overwriting g_fwd first would erase it.
          const bool was_off  = !g_on;
          const bool want_fwd = f->direction != fan::FanDirection::REVERSE;
          const bool pending  = was_off && (want_fwd != g_fwd);

          g_on = true; g_breeze = false; g_speed = (uint8_t) spd;
          auto call = f->make_call();
          call.set_state(true);
          call.set_speed(spd);   // FanCall validation clears any preset
          if (was_off && !pending) {
            // Verified: a Speed command starts a stopped fan FORWARD, whatever
            // direction it last ran in. With no pending wish to honour, mirror
            // that reality rather than carry a stale assumption forward.
            call.set_direction(fan::FanDirection::FORWARD);
            g_fwd = true;
          }
          call.perform();
          ESP_LOGI("rx_b99", "%s remote: Speed %d (%s, cnt=%u)", who, spd,
                   was_off ? "started stopped fan" : "fan running", cnt);
          // Deferred-direction settle: the remote just started the fan, so
          // apply the direction the HA user set while it was off. The fan came
          // up forward, so this transmits the wish. The reconciler cannot do
          // it (it early-returns while suppressed), but script.execute is not
          // gated by suppress_tx.
          if (pending) {
            id(tx_send).execute(unit, u_id, u_k, want_fwd ? 0x04 : 0x11, u_freq);
            g_fwd = want_fwd;
            ESP_LOGI("rx_b99", "%s: settling deferred direction -> %s", who, want_fwd ? "Forward" : "Reverse");
          }
        } else if (cmd == 0x16) {          // Fan Off
          g_on = false; g_breeze = false;
          f->turn_off().perform();
          ESP_LOGI("rx_b99", "%s remote: Fan Off (cnt=%u)", who, cnt);
        } else if (cmd == 0x06) {          // All Off
          g_on = false; g_breeze = false; g_light = false;
          f->turn_off().perform();
          lt->turn_off().perform();
          ESP_LOGI("rx_b99", "%s remote: All Off (cnt=%u)", who, cnt);
        } else if (cmd == 0x08) {          // Light — protocol-level toggle
          g_light = !g_light;
          if (g_light) lt->turn_on().perform();
          else         lt->turn_off().perform();
          ESP_LOGI("rx_b99", "%s remote: Light toggle -> assumed %s (cnt=%u)",
                   who, g_light ? "ON" : "OFF", cnt);
        } else if (cmd == 0x04 || cmd == 0x11) {   // Forward / Reverse
          const bool fwd = (cmd == 0x04);
          const bool was_on = g_on;
          auto call = f->make_call();
          call.set_direction(fwd ? fan::FanDirection::FORWARD
                                 : fan::FanDirection::REVERSE);
          if (!was_on) {
            // Verified: F/R on a stopped fan STARTS it, at its remembered
            // speed, in the pressed direction. Mirror that start. Without
            // this HA shows the fan off while it spins — and worse, the
            // reconciler's OFF branch is guarded on the assumed on-flag, so
            // HA cannot stop it until the state is resynced.
            call.set_state(true);
            call.set_speed((int) g_speed);   // also clears any stale preset
          }
          call.perform();
          // The fan applied the direction either way: while running
          // (validated), or by starting with it (verified).
          g_on = true;
          g_fwd = fwd;
          ESP_LOGI("rx_b99", "%s remote: %s (%s, cnt=%u)",
                   who, fwd ? "Forward" : "Reverse",
                   was_on ? "fan running" : "started stopped fan", cnt);
        } else if (cmd == 0x15) {          // Variable -> Breeze preset
          g_on = true; g_breeze = true;
          auto call = f->make_call();
          call.set_state(true);
          call.set_preset_mode("Breeze");
          call.perform();
          ESP_LOGI("rx_b99", "%s remote: Variable -> Breeze (cnt=%u)", who, cnt);
          // Deferred-direction settle, kept in its ORIGINAL un-gated form —
          // deliberately NOT the Speed path's version. The Speed path can
          // force g_fwd forward on a start-from-stop because we verified a
          // Speed command restarts a stopped fan forward. Whether a Variable
          // (natural-wind) command does the same is UNVERIFIED, so we do not
          // guess: this path leaves the assumed direction alone. If a bench
          // test shows Variable also restarts forward, mirror the Speed path
          // here (force forward when starting from a stop with no pending
          // wish). Until then a Breeze start from a stop may leave a stale
          // direction assumption, self-healing on the next turn-on assert.
          const bool want_fwd = f->direction != fan::FanDirection::REVERSE;
          if (want_fwd != g_fwd) {
            id(tx_send).execute(unit, u_id, u_k, want_fwd ? 0x04 : 0x11, u_freq);
            g_fwd = want_fwd;
            ESP_LOGI("rx_b99", "%s: settling deferred direction -> %s", who, want_fwd ? "Forward" : "Reverse");
          }
        } else if (cmd == 0x02 || cmd == 0x09 || cmd == 0x19) {   // Timers
          ESP_LOGI("rx_b99", "%s remote: Timer %s — no state change (entity desyncs when it fires) (cnt=%u)",
                   who, cmd == 0x02 ? "1h" : cmd == 0x09 ? "2h" : "4h", cnt);
        } else {
          ESP_LOGI("rx_b99", "%s remote: unrecognized cmd=0x%02X (cnt=%u frame=0x%08X)",
                   who, cmd, cnt, (unsigned) frame);
        }
        id(suppress_tx) = false;
