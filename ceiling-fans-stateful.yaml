# #############################################################################
# ##  B99 433MHz CEILING-FAN RF BRIDGE  —  ESP32 + CC1101 (RadioLib)         ##
# ##  STATEFUL "fan entity" variant — on-device assumed state               ##
# #############################################################################
#
#  The stateful counterpart to ceiling-fans-stateless.yaml (the stateless button
#  bridge). Same hardware, same bench-proven RF engine — but each fan is a
#  native ESPHome FAN entity (on/off, 6 speeds, direction, "Breeze" preset)
#  plus a LIGHT entity, with assumed state retained on the device and restored
#  from flash across reboots. Flash ONE variant per board; switching variants
#  creates a new device in Home Assistant (delete the stale one).
#
#  ---------------------------------------------------------------------------
#  ARCHITECTURE: single ON_STATE RECONCILER per fan. All transmit logic lives
#  in one on_state lambda that diffs the entity's commanded state against the
#  assumed-physical-state globals and transmits only the differences. This is
#  order-independent (it doesn't matter what a FanCall bundles), idempotent
#  (a second pass diffs nothing), and is the exact seam a future RX decoder
#  reuses (RX = update globals + entity under suppress; reconciler sees no
#  diff). We deliberately do NOT use on_turn_on/on_speed_set/on_direction_set:
#  their relative firing order for combined calls is not contractually
#  documented, and ESPHome has no side-effect-free publish_state for fans.
#
#  SUPPRESS GUARD: `suppress_tx` boots TRUE every boot (not restored), so
#  nothing transmitted during component setup/restore can reach the air. The
#  on_boot hook (priority -100) pushes flash-restored globals into the
#  entities (suppressed), then arms transmit as its last statement. The same
#  guard scopes every programmatic state sync (All Off, invert button, and
#  future RX) — trigger callbacks run synchronously inside perform(), so a
#  set/clear pair inside one lambda brackets them.
#
#  ASSUMED STATE — PLEASE NOTE: a transmitter cannot observe the fan. This
#  variant *chooses* to track optimistic state anyway (that's its point);
#  known desync paths and their remedies:
#    - Light is a protocol-level TOGGLE (no discrete on/off). If it drifts,
#      the "Light State Invert" diagnostic button flips the assumption
#      without transmitting.
#    - Timer buttons (1h/2h/4h) transmit fire-and-forget; when the fan's
#      timer fires, the fan entity shows on until the next command. By design
#      (timer-cancellation semantics are unverified).
#    - "All Off" transmits the atomic 0x06 frame and force-syncs fan+light
#      to off — it IS the manual resync-to-known-state affordance.
#    - Fan power cycle desyncs everything until the next command. Unavoidable
#      without RX; RX (roadmap) heals fan state on the next remote press.
#    - Direction is ASSERTED on every turn-on as [Speed N, then F/R], ~450ms
#      apart: the fan does not reliably preserve direction across a restart
#      (some units power up forward regardless of last direction), so we set
#      it explicitly instead of trusting fan memory — exactly as we already
#      send Speed N rather than trusting remembered speed. A direction change
#      made while the fan is OFF is still not transmitted immediately (that
#      would surprise-start the fan — any command starts a stopped fan); it
#      displays at once and is applied on the next turn-on.
#
#  PROVENANCE: protocol, timings, wiring, and the four hard-won fixes are
#  documented in ceiling-fans-stateless.yaml and the README. The tx_send frame
#  builder below is copied VERBATIM from the bench-proven original; only its
#  script mode (queued) and a pacing delay are new.
#
#  WIRING (ESP32-S3-DevKitM-1 <-> CC1101 E07-M1101D) — DUAL-PIN on this
#  branch (TX unchanged from the proven build; RX added on GDO2):
#    GDO0->GPIO5  (transmit data — open-drain + pullup, as always)
#    GDO2->GPIO6  (receive data — see RX section below)
#    CSN->GPIO10  SCK->GPIO12  MOSI->GPIO11  MISO->GPIO13
#    VCC->3V3 (NOT 5V)  GND->GND.
#
#  RX — LISTENING TO THE PHYSICAL REMOTES (this branch):
#    - The CC1101 demodulates continuously while parked in recv(); RadioLib's
#      async direct mode only routes data to GDO0 (which TX owns here), so
#      on_boot we set IOCFG2 = serial-data-out to ALSO route it to GDO2/GPIO6.
#      IOCFG registers persist across TX/RX state changes; one set per boot.
#    - remote_receiver (GPIO6) decodes B99 frames with the same scan-window
#      decoder as the standalone listener.
#    - Frames from OUR remotes (ID + checksum-K must BOTH match) update the
#      entities through the suppressed state-sync path (no re-transmit); the
#      native API pushes the change to Home Assistant live.
#      Command mapping: Speed N -> on/speed/exits breeze, and from a STOP it
#      also mirrors the verified forward restart (unless HA had a pending
#      direction set while off, which is then transmitted); Fan Off -> off;
#      All Off -> fan+light off; Light -> FLIPS assumed light state;
#      F/R -> direction, and from a STOP it also mirrors the fan STARTING at
#      its remembered speed; Variable -> Breeze; Timers -> logged only.
#      Both remote-initiated start paths therefore leave assumed state in
#      agreement with the fan, instead of HA showing "off" while it spins.
#    - The TX rolling counter resyncs to (heard counter + 1) so our next
#      transmit continues the remote's sequence.
#    - UNKNOWN IDs are logged at INFO (tag "rx_discover") with id/cmd/cnt and
#      the solved K — point the ESP web-page log at a new remote to onboard
#      it.
#    - Self-echo guards (belt & braces; GDO2 should be quiet during TX since
#      the demodulator is off): radio_txing flag + a 1.2 s post-TX quiet
#      window (tx_last_ms), plus whole-frame dedup (~10 repeats per press,
#      counter increments per press) so one press = one action.
#    - STATUS: working with the author's three fans. RELIABLE DECODE NEEDS
#      A CLEAN SIGNAL — one remote decodes perfectly; the other operates its
#      fan fine but arrives too noisy for consistent decode (the fan's
#      purpose-built receiver is more forgiving than our CC1101). Register
#      experiments (RX DRATE 10; DN022 AGC) each went fully deaf and were
#      reverted — the shipped SmartRC-AGC + DRATE-100 combo is a narrow
#      working point; do not retune blindly. Carrier-offset measurement via
#      SDR is the open diagnostic lead.
#    - GOAL & LIMITS: keep the fan controller, the physical remote, and this
#      ESP in sync where possible. WORK IN PROGRESS — not perfectly reliable:
#      the protocol is ONE-WAY (the controller never confirms anything), so
#      drift can only be reduced and repaired (All Off, Light State Invert),
#      never fully prevented. The radio is also deaf during its own ~400ms
#      transmits; a remote press in that window is missed.
# #############################################################################

substitutions:
  device_name: ceiling-fan-entity
  friendly_name: "Ceiling Fan Entity"
  pin_tx: "5"                 # GDO0 - transmit data
  pin_rx: "6"                 # GDO2 - receive data (IOCFG2 routed at boot)
  sync_gap: "7750"            # EV1527 31T sync-gap (us); >=4000 required
  tx_pace: "450ms"            # >= RF airtime per command: 10 repeats x (~8ms sync + 32 x ~1ms) ~= 400ms
  # --- Office fan (unit 0) ---
  office_id_dec: "953"        # 20-bit ID 0x003B9
  office_k: "11"              # checksum key 0xB
  office_freq_mhz: "433.92"   # verified working
  # --- Guest fan (unit 1) ---
  guest_id_dec: "100761"      # 20-bit ID 0x18999
  guest_k: "10"               # checksum key 0xA
  guest_freq_mhz: "433.92"    # verified working
  # --- Green fan (unit 2) ---
  green_id_dec: "6480"         # 20-bit ID 0x01950 (captured via rx_discover)
  green_k: "7"                 # checksum key 0x7 (validated across many frames)
  green_freq_mhz: "433.92"     # remote received cleanly at 433.92 (RSSI -74dBm)
  # ---- STATUS-LED (1/5, optional) -----------------------------------------
  # Onboard WS2812 data pin: ESP32-S3-DevKitM-1 = GPIO48 (per Espressif's
  # user guide); some DevKitC-1 v1.0 boards = GPIO38. A WS2812 cannot be
  # probed at runtime, but driving a pin with no LED attached is harmless —
  # boards without the LED can keep or delete the five STATUS-LED sections.
  pin_status_led: "48"

external_components:
  # Pinned commit (repo has no tags). Verified to expose the API we use:
  # _freq, setup_direct_mode(), xmit(), recv(), standby(), set_rx_pin.
  - source: github://juanboro/esphome-radiolib-cc1101@b79b8552d09682da561d8ff9b4b71ccea9b75f1b
    components: [ radiolib_cc1101 ]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Boot sync: push flash-restored assumed state into the entities WITHOUT
  # transmitting, then arm TX. suppress_tx boots true, so anything fired
  # earlier during component setup/restore is inert too (defense #1); this
  # hook is defense #3. Priority -100 = after all components are set up.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Route demodulated RX data to GDO2 (GPIO6). RadioLib's async
          // direct mode only configures GDO0 — which TX owns here. IOCFG
          // registers persist across TX/RX state changes and nothing else
          // (recv()/xmit()/set_registers()) touches IOCFG2, so once per boot
          // suffices. radio.begin() already ran in component setup.
          id(mycc1101).radio.SPIsetRegValue(RADIOLIB_CC1101_REG_IOCFG2,
                                            RADIOLIB_CC1101_GDOX_SERIAL_DATA_ASYNC, 5, 0);
          ESP_LOGI("rx_b99", "IOCFG2 set: RX data routed to GDO2/GPIO%d", ${pin_rx});
          {  // Office fan
            auto call = id(office_fan).make_call();
            call.set_state(id(office_fan_on));
            call.set_direction(id(office_fan_fwd) ? fan::FanDirection::FORWARD
                                                  : fan::FanDirection::REVERSE);
            if (id(office_fan_on) && id(office_fan_breeze)) {
              call.set_preset_mode("Breeze");   // set_speed would clear it (FanCall validation)
            } else {
              // Set stored speed even when OFF: a bare turn_on with entity
              // speed 0 gets forced to MAX by FanCall validation, which
              // would clobber "resume last speed" after a fresh boot.
              call.set_speed(id(office_fan_speed));
            }
            call.perform();  // fires on_state -> suppressed no-op
          }
          {  // Guest fan
            auto call = id(guest_fan).make_call();
            call.set_state(id(guest_fan_on));
            call.set_direction(id(guest_fan_fwd) ? fan::FanDirection::FORWARD
                                                 : fan::FanDirection::REVERSE);
            if (id(guest_fan_on) && id(guest_fan_breeze)) {
              call.set_preset_mode("Breeze");
            } else {
              call.set_speed(id(guest_fan_speed));
            }
            call.perform();
          }
          {  // Green fan
            auto call = id(green_fan).make_call();
            call.set_state(id(green_fan_on));
            call.set_direction(id(green_fan_fwd) ? fan::FanDirection::FORWARD
                                                : fan::FanDirection::REVERSE);
            if (id(green_fan_on) && id(green_fan_breeze)) {
              call.set_preset_mode("Breeze");
            } else {
              call.set_speed(id(green_fan_speed));
            }
            call.perform();
          }
          // Lights: align entities to assumed state (write_action suppressed).
          if (id(office_light_on)) id(office_light).turn_on().perform();
          else                     id(office_light).turn_off().perform();
          if (id(guest_light_on))  id(guest_light).turn_on().perform();
          else                     id(guest_light).turn_off().perform();
          if (id(green_light_on))   id(green_light).turn_on().perform();
          else                     id(green_light).turn_off().perform();
          // ARM transmit — must be the last statement of the boot sync.
          id(suppress_tx) = false;

# Assumed state changes a few times a day; 10s batching means a power cut
# loses at most 10s of history while keeping NVS wear negligible.
preferences:
  flash_write_interval: 10s

esp32:
  board: esp32-s3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret esp_433_radio__encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    on_begin:
      - lambda: id(mycc1101).standby();
    # A successful OTA reboots (on_boot re-arms everything), but a FAILED or
    # aborted OTA keeps running with the radio parked in standby — RX would
    # go silently deaf until the next transmit. Recover explicitly.
    on_error:
      - lambda: id(mycc1101).recv();

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# Transmit on GDO0/GPIO5. The radiolib component keys the CC1101 via the
# remote_transmitter's on_transmit/on_complete hooks (xmit()/recv()), so the
# radio returns to RX/idle after each transmit and does NOT hold a band keyed.
# radio_txing brackets each transmission — the Phase-2 RX handler gates on it
# to ignore self-echo on the shared pin.
remote_transmitter:
  id: rf_transmitter
  pin:
    number: ${pin_tx}
    mode:
      output: true
      input: true
      open_drain: true
      pullup: true
    id: cc1101_gd0_xmit
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - lambda: |-
          id(radio_txing) = true;
          id(tx_last_ms) = millis();
          id(mycc1101).xmit();
  on_complete:
    then:
      - lambda: |-
          id(mycc1101).recv();
          id(radio_txing) = false;
          id(tx_last_ms) = millis();

radiolib_cc1101:
  id: mycc1101
  cs_pin: GPIO10
  bitrate: 100
  # RX data is routed to GDO2/GPIO6 by the IOCFG2 write in on_boot (RadioLib
  # only configures GDO0, which TX owns). rx_pin is deliberately NOT set: it
  # only feeds the component's opportunistic RSSI sampling, and leaving it
  # out keeps GPIO6 exclusively owned by the remote_receiver RMT channel.

globals:
  # --- Protocol counters (unchanged from the radio variant; part of the RF
  # --- protocol, not UX state) ---
  - id: ctr_office
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: ctr_guest
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: ctr_green
    type: uint8_t
    restore_value: true
    initial_value: '0'
  # --- Assumed physical state, Office (flash-restored source of truth; the
  # --- fan entity itself uses restore_mode: NO_RESTORE because template-fan
  # --- restore is unreliable on esp-idf) ---
  - id: office_fan_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: office_fan_speed        # last FIXED speed (1..6, never 0); survives off/breeze
    type: uint8_t
    restore_value: true
    initial_value: '3'
  - id: office_fan_fwd          # assumed PHYSICAL direction (true = forward)
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: office_fan_breeze
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: office_light_on         # assumed light state (the protocol only has toggle)
    type: bool
    restore_value: true
    initial_value: 'false'
  # --- Assumed physical state, Guest ---
  - id: guest_fan_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: guest_fan_speed
    type: uint8_t
    restore_value: true
    initial_value: '3'
  - id: guest_fan_fwd
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: guest_fan_breeze
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: guest_light_on
    type: bool
    restore_value: true
    initial_value: 'false'
  # --- Assumed physical state, Green ---
  - id: green_fan_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: green_fan_speed
    type: uint8_t
    restore_value: true
    initial_value: '3'
  - id: green_fan_fwd
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: green_fan_breeze
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: green_light_on
    type: bool
    restore_value: true
    initial_value: 'false'
  # --- Guards (never restored) ---
  - id: suppress_tx             # boots TRUE: boot guard + programmatic-sync guard
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: radio_txing             # self-echo gate (set/cleared by TX hooks)
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: tx_last_ms              # last TX activity (millis); RX quiet-window gate
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # ---- STATUS-LED (2/5, optional) — last accepted RX press (millis). The
  # ---- write in the RX dispatch is harmless if the LED sections are removed.
  - id: rx_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

# -----------------------------------------------------------------------------
# Single transmit primitive — frame builder copied VERBATIM from the
# bench-proven radio variant. New here: mode: queued serializes overlapping
# executes (slider drags, [Speed, F/R] sequences, both fans at once) and keeps
# the per-unit retune from firing mid-transmission; the trailing delay holds
# each run active for the full RF airtime.
#   unit : 0=office, 1=guest, 2=green   (selects the per-unit counter)
#   id_  : 20-bit fan ID    k : 4-bit checksum key    cmd : 5-bit B99 command
#   freq : carrier frequency in MHz for THIS unit
# -----------------------------------------------------------------------------
script:
  - id: tx_send
    mode: queued
    # Deep queue: the reconcilers commit assumed-state globals at the same
    # moment they enqueue the transmit, so a dropped run = silent desync
    # (heal via All Off). 30 runs = ~13.5s worst-case backlog; a burst that
    # deep means something upstream is wrong anyway, and ESPHome logs a
    # warning on overflow.
    max_runs: 30
    parameters:
      unit: int
      id_: int
      k: int
      cmd: int
      freq: float
    then:
      - lambda: |-
          // Tune the CC1101 to THIS unit's carrier frequency before transmitting.
          id(mycc1101)._freq = freq;
          id(mycc1101).setup_direct_mode();
          const int MARK_1  = 759, SPACE_1 = 243;   // bit 1 (3:1)
          const int MARK_0  = 251, SPACE_0 = 749;   // bit 0 (1:3)
          const int SYNC_H  = 250;                  // sync header high
          const int SYNC_L  = ${sync_gap};          // sync header low gap (us)
          const int REPEATS = 10;
          uint8_t cnt = ((unit == 0) ? id(ctr_office)
                       : (unit == 1) ? id(ctr_guest)
                                     : id(ctr_green)) & 0x7;
          // Assemble 32-bit frame: [20 id][5 cmd][3 cnt][4 checksum]
          uint32_t v = (((uint32_t)(cmd & 0x1F)) << 7) | ((uint32_t)cnt << 4);
          uint8_t A = (v >> 8) & 0xF;               // nibble bits 11-8
          uint8_t B = (v >> 4) & 0xF;               // nibble bits 7-4
          v |= (uint8_t)(A ^ B ^ (k & 0xF));        // checksum low nibble
          uint32_t frame = (((uint32_t)(id_ & 0xFFFFF)) << 12) | v;
          // Emit SYNC + 32 bits, repeated, as a single transmit.
          auto call = id(rf_transmitter).transmit();
          auto *d = call.get_data();
          d->set_carrier_frequency(0);
          d->reserve(REPEATS * 70 + 8);
          for (int r = 0; r < REPEATS; r++) {
            d->item(SYNC_H, SYNC_L);
            for (int i = 31; i >= 0; i--) {
              if ((frame >> i) & 0x1) d->item(MARK_1, SPACE_1);
              else                    d->item(MARK_0, SPACE_0);
            }
          }
          call.set_send_times(1);
          call.set_send_wait(0);
          call.perform();
          if (unit == 0)      id(ctr_office) = (cnt + 1) & 0x7;
          else if (unit == 1) id(ctr_guest)  = (cnt + 1) & 0x7;
          else                id(ctr_green)   = (cnt + 1) & 0x7;
          ESP_LOGD("tx_send", "unit=%d id=0x%05X cmd=0x%02X cnt=%u freq=%.2f frame=0x%08X",
                   unit, (unsigned)(id_ & 0xFFFFF), (unsigned)cmd,
                   (unsigned)cnt, freq, (unsigned)frame);
      - delay: ${tx_pace}

# -----------------------------------------------------------------------------
# FAN ENTITIES — one on_state reconciler each (see header). Command map used:
#   Fan Off=0x16  Forward=0x04  Reverse=0x11  Variable/Breeze=0x15
#   Speed1..6 = 0x10 0x12 0x1C 0x0A 0x0F 0x0C   (absolute; Speed N is also
#   the turn-on command — bench-verify item A)
# -----------------------------------------------------------------------------
fan:
  - platform: template
    id: office_fan
    name: "Office Fan"
    speed_count: 6
    has_direction: true
    preset_modes:
      - "Breeze"
    restore_mode: NO_RESTORE   # globals are the source of truth (see on_boot)
    on_state:
      - lambda: |-
          if (id(suppress_tx)) return;   // boot restore / All Off / Phase-2 RX sync
          auto *f = id(office_fan);
          const bool want_on  = f->state;
          // "Breeze" is the only preset, so any active preset means Breeze.
          const bool want_brz = want_on && f->has_preset_mode();
          const bool want_fwd = f->direction != fan::FanDirection::REVERSE;
          int want_spd = f->speed;
          if (want_spd < 1 || want_spd > 6) want_spd = id(office_fan_speed);  // turn-on w/o pct -> last speed
          const bool was_off = !id(office_fan_on);   // capture before step 3 flips it
          static const uint8_t SPD_CMD[7] = {0, 0x10, 0x12, 0x1C, 0x0A, 0x0F, 0x0C};

          // 1) OFF (direction flips while off are NOT transmitted — deferred
          //    to the next turn-on; see header)
          if (!want_on) {
            if (id(office_fan_on)) {
              id(tx_send).execute(0, ${office_id_dec}, ${office_k}, 0x16, ${office_freq_mhz});
              id(office_fan_on) = false;
              id(office_fan_breeze) = false;   // fan stop clears breeze physically
            }
            return;
          }
          // 2) Breeze preset (Variable 0x15); fixed-speed global intentionally untouched
          if (want_brz) {
            if (!id(office_fan_breeze) || !id(office_fan_on)) {
              id(tx_send).execute(0, ${office_id_dec}, ${office_k}, 0x15, ${office_freq_mhz});
              id(office_fan_on) = true;
              id(office_fan_breeze) = true;
            }
          }
          // 3) Fixed speed — absolute; doubles as turn-on and as breeze-exit
          else if (!id(office_fan_on) || id(office_fan_breeze) || want_spd != (int) id(office_fan_speed)) {
            id(tx_send).execute(0, ${office_id_dec}, ${office_k}, SPD_CMD[want_spd], ${office_freq_mhz});
            id(office_fan_on) = true;
            id(office_fan_breeze) = false;
            id(office_fan_speed) = want_spd;
          }
          // 4) Direction — F/R preserves speed (validated), F/R absolute so a
          //    redundant assert is harmless. Sent on any change while running,
          //    AND on every turn-on (was_off): the fan may power up forward
          //    regardless of last direction, so assert rather than trust its
          //    memory. Runs after 3 -> turn-on settles as [Speed N, then F/R].
          //    (Breeze turn-on excluded: direction in natural-wind mode is
          //    unverified.)
          if (want_fwd != id(office_fan_fwd) || (was_off && !want_brz)) {
            id(tx_send).execute(0, ${office_id_dec}, ${office_k}, want_fwd ? 0x04 : 0x11, ${office_freq_mhz});
            id(office_fan_fwd) = want_fwd;
          }

  - platform: template
    id: guest_fan
    name: "Guest Fan"
    speed_count: 6
    has_direction: true
    preset_modes:
      - "Breeze"
    restore_mode: NO_RESTORE
    on_state:
      - lambda: |-
          if (id(suppress_tx)) return;
          auto *f = id(guest_fan);
          const bool want_on  = f->state;
          const bool want_brz = want_on && f->has_preset_mode();
          const bool want_fwd = f->direction != fan::FanDirection::REVERSE;
          int want_spd = f->speed;
          if (want_spd < 1 || want_spd > 6) want_spd = id(guest_fan_speed);
          const bool was_off = !id(guest_fan_on);   // capture before step 3 flips it
          static const uint8_t SPD_CMD[7] = {0, 0x10, 0x12, 0x1C, 0x0A, 0x0F, 0x0C};

          if (!want_on) {
            if (id(guest_fan_on)) {
              id(tx_send).execute(1, ${guest_id_dec}, ${guest_k}, 0x16, ${guest_freq_mhz});
              id(guest_fan_on) = false;
              id(guest_fan_breeze) = false;
            }
            return;
          }
          if (want_brz) {
            if (!id(guest_fan_breeze) || !id(guest_fan_on)) {
              id(tx_send).execute(1, ${guest_id_dec}, ${guest_k}, 0x15, ${guest_freq_mhz});
              id(guest_fan_on) = true;
              id(guest_fan_breeze) = true;
            }
          }
          else if (!id(guest_fan_on) || id(guest_fan_breeze) || want_spd != (int) id(guest_fan_speed)) {
            id(tx_send).execute(1, ${guest_id_dec}, ${guest_k}, SPD_CMD[want_spd], ${guest_freq_mhz});
            id(guest_fan_on) = true;
            id(guest_fan_breeze) = false;
            id(guest_fan_speed) = want_spd;
          }
          // Direction — assert on any change while running AND on every
          // turn-on (was_off); see the office fan for rationale.
          if (want_fwd != id(guest_fan_fwd) || (was_off && !want_brz)) {
            id(tx_send).execute(1, ${guest_id_dec}, ${guest_k}, want_fwd ? 0x04 : 0x11, ${guest_freq_mhz});
            id(guest_fan_fwd) = want_fwd;
          }

  - platform: template
    id: green_fan
    name: "Green Fan"
    speed_count: 6
    has_direction: true
    preset_modes:
      - "Breeze"
    restore_mode: NO_RESTORE
    on_state:
      - lambda: |-
          if (id(suppress_tx)) return;
          auto *f = id(green_fan);
          const bool want_on  = f->state;
          const bool want_brz = want_on && f->has_preset_mode();
          const bool want_fwd = f->direction != fan::FanDirection::REVERSE;
          int want_spd = f->speed;
          if (want_spd < 1 || want_spd > 6) want_spd = id(green_fan_speed);
          const bool was_off = !id(green_fan_on);   // capture before step 3 flips it
          static const uint8_t SPD_CMD[7] = {0, 0x10, 0x12, 0x1C, 0x0A, 0x0F, 0x0C};

          if (!want_on) {
            if (id(green_fan_on)) {
              id(tx_send).execute(2, ${green_id_dec}, ${green_k}, 0x16, ${green_freq_mhz});
              id(green_fan_on) = false;
              id(green_fan_breeze) = false;
            }
            return;
          }
          if (want_brz) {
            if (!id(green_fan_breeze) || !id(green_fan_on)) {
              id(tx_send).execute(2, ${green_id_dec}, ${green_k}, 0x15, ${green_freq_mhz});
              id(green_fan_on) = true;
              id(green_fan_breeze) = true;
            }
          }
          else if (!id(green_fan_on) || id(green_fan_breeze) || want_spd != (int) id(green_fan_speed)) {
            id(tx_send).execute(2, ${green_id_dec}, ${green_k}, SPD_CMD[want_spd], ${green_freq_mhz});
            id(green_fan_on) = true;
            id(green_fan_breeze) = false;
            id(green_fan_speed) = want_spd;
          }
          // Direction — assert on any change while running AND on every
          // turn-on (was_off); see the office fan for rationale.
          if (want_fwd != id(green_fan_fwd) || (was_off && !want_brz)) {
            id(tx_send).execute(2, ${green_id_dec}, ${green_k}, want_fwd ? 0x04 : 0x11, ${green_freq_mhz});
            id(green_fan_fwd) = want_fwd;
          }

# -----------------------------------------------------------------------------
# LIGHTS — binary light over a template output implementing toggle-on-
# difference: the RF Light command (0x08) is a pure toggle, so we transmit
# only when the commanded state differs from the assumed state.
# -----------------------------------------------------------------------------
output:
  - platform: template
    id: office_light_out
    type: binary
    write_action:
      - lambda: |-
          if (id(suppress_tx)) return;              // boot restore / All Off / invert / RX sync
          if (state == id(office_light_on)) return; // already there — no RF
          id(tx_send).execute(0, ${office_id_dec}, ${office_k}, 0x08, ${office_freq_mhz});
          id(office_light_on) = state;
  - platform: template
    id: guest_light_out
    type: binary
    write_action:
      - lambda: |-
          if (id(suppress_tx)) return;
          if (state == id(guest_light_on)) return;
          id(tx_send).execute(1, ${guest_id_dec}, ${guest_k}, 0x08, ${guest_freq_mhz});
          id(guest_light_on) = state;
  - platform: template
    id: green_light_out
    type: binary
    write_action:
      - lambda: |-
          if (id(suppress_tx)) return;
          if (state == id(green_light_on)) return;
          id(tx_send).execute(2, ${green_id_dec}, ${green_k}, 0x08, ${green_freq_mhz});
          id(green_light_on) = state;

light:
  # ---- STATUS-LED (3/5, optional) — the onboard WS2812, internal (not a
  # ---- user light; painted by the interval below).
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: "Status LED"
    internal: true
    pin: ${pin_status_led}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    # CRITICAL: the S3 default here is 192 = ALL FOUR RMT TX channels' memory
    # (48 x 4). Left at default, this single LED starves remote_transmitter
    # ("no free tx channels" -> remote_transmitter marked FAILED -> no radio
    # TX, and the LED itself turns red reporting it). One 48-symbol block is
    # ample for a single WS2812 (24 bits + reset).
    rmt_symbols: 48
  - platform: binary
    id: office_light
    name: "Office Light"
    output: office_light_out
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: binary
    id: guest_light
    name: "Guest Light"
    output: guest_light_out
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: binary
    id: green_light
    name: "Green Light"
    output: green_light_out
    restore_mode: RESTORE_DEFAULT_OFF

# ---- STATUS-LED (4/5, optional) — the painter. Priority order: component
# ---- error (red) > warning (yellow) > wifi down (orange) > RX decoded
# ---- (cyan, ~1.5s) > transmitting (white, ~0.6s) > no HA client (blue) >
# ---- healthy (dim green). Event colors self-restore on the next tick; the
# ---- state cache keeps this from spamming light calls every 250ms.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          static uint8_t last_state = 255;
          const uint32_t ms = millis();
          const uint8_t app = App.get_app_state();
          uint8_t s;
          if (app & STATUS_LED_ERROR)                                    s = 0;
          else if (app & STATUS_LED_WARNING)                             s = 1;
          else if (!wifi::global_wifi_component->is_connected())         s = 2;
          else if (id(rx_last_ms) != 0 && ms - id(rx_last_ms) < 1500)    s = 3;
          else if (id(tx_last_ms) != 0 && ms - id(tx_last_ms) < 600)     s = 4;
          else if (!api::global_api_server->is_connected())              s = 5;
          else                                                           s = 6;
          if (s == last_state) return;
          last_state = s;
          float r = 0, g = 0, b = 0, br = 0.30f;
          switch (s) {
            case 0: r = 1;                          break;  // red: error
            case 1: r = 1; g = 0.6f;                break;  // yellow: warning
            case 2: r = 1; g = 0.25f;               break;  // orange: wifi down
            case 3: g = 1; b = 1;    br = 0.50f;    break;  // cyan: RX press
            case 4: r = 1; g = 1; b = 1; br = 0.5f; break;  // white: TX
            case 5: b = 1;                          break;  // blue: no HA client
            case 6: g = 1;           br = 0.08f;    break;  // dim green: healthy
          }
          auto call = id(status_rgb).turn_on();
          call.set_transition_length(0);
          call.set_rgb(r, g, b);
          call.set_brightness(br);
          call.perform();

# -----------------------------------------------------------------------------
# RAW BUTTONS. Rule: raw buttons never route through entity calls; each owns
# its state consequences explicitly.
#   - Timers: fire-and-forget TX, touch NO state (entity desyncs when the
#     fan's timer fires — documented).
#   - All Off: atomic 0x06 (kills fan+light regardless of assumed state —
#     which is exactly why it is NOT an entity call: an entity-driven light
#     TOGGLE is wrong precisely when state has drifted), then force-sync both
#     entities to off under the suppress guard. THE resync affordance.
#   - Light State Invert (diagnostic): no RF; flips the assumed light state
#     for one-press recovery when the toggle-only light drifts.
# -----------------------------------------------------------------------------
button:
  # ============================ OFFICE (unit 0) ============================
  - platform: template
    name: "Office Timer 1h"
    icon: mdi:timer
    on_press:
      - script.execute:
          id: tx_send
          unit: 0
          id_: ${office_id_dec}
          k: ${office_k}
          cmd: 2
          freq: ${office_freq_mhz}
  - platform: template
    name: "Office Timer 2h"
    icon: mdi:timer
    on_press:
      - script.execute:
          id: tx_send
          unit: 0
          id_: ${office_id_dec}
          k: ${office_k}
          cmd: 9
          freq: ${office_freq_mhz}
  - platform: template
    name: "Office Timer 4h"
    icon: mdi:timer
    on_press:
      - script.execute:
          id: tx_send
          unit: 0
          id_: ${office_id_dec}
          k: ${office_k}
          cmd: 25
          freq: ${office_freq_mhz}
  - platform: template
    name: "Office All Off"
    icon: mdi:power-off
    on_press:
      - script.execute:
          id: tx_send
          unit: 0
          id_: ${office_id_dec}
          k: ${office_k}
          cmd: 6
          freq: ${office_freq_mhz}
      - lambda: |-
          // Force-sync assumed + entity state to off. Triggers fired by the
          // perform() calls run synchronously, so the suppress pair brackets
          // them (bench-verify: All Off log trace shows exactly one tx_send).
          id(suppress_tx) = true;
          id(office_fan_on) = false;
          id(office_fan_breeze) = false;
          id(office_light_on) = false;
          id(office_fan).turn_off().perform();
          id(office_light).turn_off().perform();
          id(suppress_tx) = false;
  - platform: template
    name: "Office Light State Invert"
    icon: mdi:lightbulb-question
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // No RF — flip the assumption and mirror it to the entity.
          id(suppress_tx) = true;
          id(office_light_on) = !id(office_light_on);
          if (id(office_light_on)) id(office_light).turn_on().perform();
          else                     id(office_light).turn_off().perform();
          id(suppress_tx) = false;

